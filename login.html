<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>

<body style="background:linear-gradient(to right,#00c6ff,#0072ff); font-family:Arial;">

<div style="
width:350px;
margin:120px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,0.3);
text-align:center;
">

<h2 style="color:#0072ff;">AQI Monitoring Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required
style="width:90%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px;"><br>

<input type="password" name="password" placeholder="Password" required
style="width:90%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px;"><br>

<button type="submit"
style="background:#0072ff; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">
Login
</button>

</form>

{% if error %}
<p style="color:red">{{error}}</p>
{% endif %}

</div>

</body>
</html>
